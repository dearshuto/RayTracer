[workspace]
resolver = "2"
members = [
    "client",
    "sjrt",
    "sjrt-edit",
    "sjrt-macro",
    "sjrt-net",
    "sjrt-res",
    "editor/cornell_box",
    "server",
]

[workspace.dependencies]
clap = { version = "3.0", features = ["derive"] }
futures = "0.3.19"
image = "0.25"
nalgebra = "0.33"
num = "*"
serde = { version = "1.0", features = ["derive"] }
serde_qs = "*"